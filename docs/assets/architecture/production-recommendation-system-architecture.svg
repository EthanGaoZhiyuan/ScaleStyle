<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="ScaleStyle system architecture overview">
  <!-- Background -->
  <rect width="1400" height="850" fill="#ffffff"/>

  <!-- Defs -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="50" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="0.2">ScaleStyle — System Architecture</text>
  <text x="60" y="74" font-size="13" fill="#64748b">Synchronous retrieve + rerank · asynchronous click feedback · Redis-backed personalization</text>

  <!-- Legend -->
  <g font-size="12" fill="#475569">
    <g transform="translate(820,42)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#1d4ed8" stroke-width="2.4"/>
      <text x="38" y="14">Synchronous request</text>
    </g>
    <g transform="translate(990,42)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4"/>
      <text x="38" y="14">Async click feedback</text>
    </g>
    <g transform="translate(1160,42)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#b91c1c" stroke-width="2.4"/>
      <text x="38" y="14">Fallback</text>
    </g>
    <g transform="translate(820,66)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2 3"/>
      <text x="38" y="14">Observability / deployment</text>
    </g>
  </g>

  <!-- =========================================================
       ROW 1 — Synchronous request path
       ========================================================= -->

  <!-- Client -->
  <g>
    <rect x="60" y="170" width="130" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="60" y="170" width="130" height="4" rx="2" fill="#1d4ed8"/>
    <text x="125" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Client</text>
    <text x="125" y="240" text-anchor="middle" font-size="11" fill="#64748b">API caller</text>
    <text x="125" y="258" text-anchor="middle" font-size="11" fill="#64748b">curl · web · mobile</text>
  </g>

  <!-- Gateway -->
  <g>
    <rect x="220" y="130" width="240" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="220" y="130" width="240" height="4" rx="2" fill="#1d4ed8"/>
    <text x="340" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Gateway</text>
    <text x="340" y="180" text-anchor="middle" font-size="11" fill="#64748b">Public API entry</text>
    <g font-size="11" fill="#1e293b">
      <rect x="240" y="198" width="80" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="280" y="213" text-anchor="middle">Java 21</text>
      <rect x="328" y="198" width="100" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="378" y="213" text-anchor="middle">Spring Boot</text>
      <rect x="240" y="228" width="80" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="280" y="243" text-anchor="middle">WebFlux</text>
      <rect x="328" y="228" width="112" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="384" y="243" text-anchor="middle">Resilience4j</text>
    </g>
    <text x="340" y="278" text-anchor="middle" font-size="11" fill="#475569">Reactor WebClient · Caffeine L1</text>
    <text x="340" y="294" text-anchor="middle" font-size="11" fill="#475569">Circuit breaker · timeout budget</text>
    <text x="340" y="316" text-anchor="middle" font-size="10" fill="#94a3b8">gateway-service/</text>
  </g>

  <!-- Inference -->
  <g>
    <rect x="490" y="130" width="320" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="490" y="130" width="320" height="4" rx="2" fill="#1d4ed8"/>
    <text x="650" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Inference Service</text>
    <text x="650" y="180" text-anchor="middle" font-size="11" fill="#64748b">Ray Serve · FastAPI Ingress</text>
    <g font-size="11" fill="#1e293b">
      <rect x="510" y="198" width="130" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="575" y="213" text-anchor="middle">BGE-small text</text>
      <rect x="648" y="198" width="142" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="719" y="213" text-anchor="middle">bge-reranker-base</text>
      <rect x="510" y="228" width="130" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="575" y="243" text-anchor="middle">BehaviorBoost</text>
      <rect x="648" y="228" width="142" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="719" y="243" text-anchor="middle" fill="#475569">CLIP ViT-B/32 (opt-in)</text>
    </g>
    <text x="650" y="278" text-anchor="middle" font-size="11" fill="#475569">Embed → retrieve → rerank → boost</text>
    <text x="650" y="294" text-anchor="middle" font-size="11" fill="#475569">Per-request PersonalizationSnapshot</text>
    <text x="650" y="316" text-anchor="middle" font-size="10" fill="#94a3b8">inference-service/</text>
  </g>

  <!-- Storage -->
  <g>
    <rect x="840" y="130" width="500" height="430" rx="10" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="840" y="130" width="500" height="4" rx="2" fill="#1d4ed8"/>
    <text x="1090" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Storage &amp; State</text>
    <text x="1090" y="180" text-anchor="middle" font-size="11" fill="#64748b">Vector DB · cache · feature store</text>

    <!-- Milvus text -->
    <g>
      <rect x="860" y="200" width="220" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="970" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Milvus · text collection</text>
      <text x="970" y="244" text-anchor="middle" font-size="11" fill="#64748b">BGE-small · 384-dim · IVF_FLAT</text>
      <text x="970" y="262" text-anchor="middle" font-size="11" fill="#64748b">~105k H&amp;M articles</text>
    </g>
    <!-- Milvus image -->
    <g>
      <rect x="1100" y="200" width="220" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="1210" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Milvus · image collection</text>
      <text x="1210" y="244" text-anchor="middle" font-size="11" fill="#64748b">CLIP ViT-B/32 · 512-dim</text>
      <text x="1210" y="262" text-anchor="middle" font-size="11" fill="#64748b">IVF_FLAT · inner product</text>
    </g>
    <!-- Redis -->
    <g>
      <rect x="860" y="298" width="460" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="1090" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Redis</text>
      <text x="1090" y="340" text-anchor="middle" font-size="11" fill="#64748b">L2 cache · item metadata · online features · fallback</text>

      <g font-size="11" fill="#1e293b">
        <rect x="880" y="358" width="200" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="980" y="378" text-anchor="middle">item:{id} metadata hashes</text>

        <rect x="1100" y="358" width="200" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="1200" y="378" text-anchor="middle">user:{id}:recent_clicks</text>

        <rect x="880" y="402" width="200" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="980" y="422" text-anchor="middle">user:{id}:category_affinity</text>

        <rect x="1100" y="402" width="200" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="1200" y="422" text-anchor="middle">popularity:materialized:24h/7d</text>

        <rect x="880" y="446" width="420" height="34" rx="6" fill="#fef2f2" stroke="#fecaca"/>
        <text x="1090" y="466" text-anchor="middle" fill="#b91c1c">global:popular (fallback ZSET · 1,147 entries)</text>
      </g>
      <text x="1090" y="510" text-anchor="middle" font-size="11" fill="#475569">Read by Inference (personalization) · Read by Gateway (fallback)</text>
      <text x="1090" y="526" text-anchor="middle" font-size="11" fill="#475569">Written by Event Consumer (Lua-atomic)</text>
    </g>
  </g>

  <!-- Sync arrows: Client → Gateway → Inference → Storage(Milvus) -->
  <line x1="190" y1="230" x2="218" y2="230" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <line x1="460" y1="230" x2="488" y2="230" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="474" y="222" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="600">HTTP/REST</text>

  <line x1="810" y1="230" x2="858" y2="230" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="834" y="222" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="600">ANN query</text>

  <!-- Inference reads Redis features (personalization): dashed blue from Inference right edge to Redis -->
  <path d="M 810 280 L 838 280" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
  <text x="824" y="272" text-anchor="middle" font-size="10" fill="#1d4ed8">read features</text>

  <!-- Gateway fallback to Redis (red) — routed under inference card -->
  <path d="M 400 330 L 400 380 L 855 380" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="620" y="372" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="600">circuit open → fallback</text>

  <!-- =========================================================
       ROW 2 — Async event pipeline
       ========================================================= -->
  <!-- Panel header -->
  <text x="60" y="408" font-size="13" font-weight="700" fill="#0f172a">Event pipeline</text>
  <text x="60" y="424" font-size="11" fill="#64748b">click → Kafka → consumer → Redis</text>

  <!-- Kafka -->
  <g>
    <rect x="220" y="440" width="170" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="220" y="440" width="170" height="4" rx="2" fill="#d97706"/>
    <text x="305" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Kafka</text>
    <text x="305" y="490" text-anchor="middle" font-size="11" fill="#64748b">click topic</text>
    <text x="305" y="508" text-anchor="middle" font-size="11" fill="#64748b">broker-ACK · idempotent</text>
    <text x="305" y="530" text-anchor="middle" font-size="10" fill="#94a3b8">retry.1s / 10s / 60s</text>
  </g>

  <!-- Primary consumer -->
  <g>
    <rect x="420" y="440" width="200" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="420" y="440" width="200" height="4" rx="2" fill="#d97706"/>
    <text x="520" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Event Consumer</text>
    <text x="520" y="490" text-anchor="middle" font-size="11" fill="#64748b">primary group</text>
    <text x="520" y="508" text-anchor="middle" font-size="11" fill="#64748b">Lua-atomic Redis writes</text>
    <text x="520" y="530" text-anchor="middle" font-size="10" fill="#94a3b8">event-consumer/</text>
  </g>

  <!-- Retry consumer -->
  <g>
    <rect x="650" y="440" width="170" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="650" y="440" width="170" height="4" rx="2" fill="#d97706"/>
    <text x="735" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Retry Consumer</text>
    <text x="735" y="490" text-anchor="middle" font-size="11" fill="#64748b">independent group</text>
    <text x="735" y="508" text-anchor="middle" font-size="11" fill="#64748b">tiered backoff</text>
  </g>

  <!-- DLQ -->
  <g>
    <rect x="0" y="0" width="0" height="0"/>
    <rect x="0" y="0" width="0" height="0"/>
  </g>

  <!-- =========================================================
       Async arrows
       ========================================================= -->
  <!-- Gateway → Kafka -->
  <path d="M 340 330 L 340 438" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
  <text x="348" y="392" font-size="10" fill="#d97706" font-weight="600">publish click</text>

  <!-- Kafka → Primary -->
  <line x1="390" y1="495" x2="418" y2="495" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
  <!-- Primary → Retry -->
  <line x1="620" y1="495" x2="648" y2="495" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>

  <!-- Primary → Redis features (writes) -->
  <path d="M 520 440 C 520 410, 860 410, 880 402" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
  <text x="700" y="404" font-size="10" fill="#d97706" font-weight="600">write online features</text>

  <!-- Retry → DLQ pill (mini) -->
  <g>
    <rect x="840" y="466" width="90" height="58" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="885" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">DLQ</text>
    <text x="885" y="508" text-anchor="middle" font-size="10" fill="#9a3412">dead-letter</text>
  </g>
  <line x1="820" y1="495" x2="838" y2="495" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>

  <!-- =========================================================
       ROW 3 — Observability + Deployment
       ========================================================= -->

  <!-- Observability -->
  <g>
    <rect x="60" y="610" width="780" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="60" y="610" width="780" height="4" rx="2" fill="#64748b"/>
    <text x="80" y="640" font-size="14" font-weight="700" fill="#0f172a">Observability</text>
    <text x="80" y="658" font-size="11" fill="#64748b">W3C traceparent propagated gateway → inference</text>

    <g font-size="12" fill="#1e293b">
      <rect x="80" y="678" width="170" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="165" y="700" text-anchor="middle" font-weight="600">OpenTelemetry</text>
      <text x="165" y="716" text-anchor="middle" font-size="10" fill="#64748b">trace propagation</text>

      <rect x="270" y="678" width="170" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="355" y="700" text-anchor="middle" font-weight="600">Jaeger</text>
      <text x="355" y="716" text-anchor="middle" font-size="10" fill="#64748b">trace UI · 16686</text>

      <rect x="460" y="678" width="170" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="545" y="700" text-anchor="middle" font-weight="600">Prometheus</text>
      <text x="545" y="716" text-anchor="middle" font-size="10" fill="#64748b">metrics scrape · 9090</text>

      <rect x="650" y="678" width="170" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="735" y="700" text-anchor="middle" font-weight="600">Grafana</text>
      <text x="735" y="716" text-anchor="middle" font-size="10" fill="#64748b">dashboards · 3000</text>
    </g>
    <text x="80" y="758" font-size="11" fill="#475569">All four services emit Prometheus metrics; dashboards auto-provisioned.</text>
    <text x="80" y="776" font-size="11" fill="#475569">Distributed tracing covers gateway controller → WebClient → inference ingress.</text>
  </g>

  <!-- Deployment -->
  <g>
    <rect x="870" y="610" width="470" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="870" y="610" width="470" height="4" rx="2" fill="#64748b"/>
    <text x="890" y="640" font-size="14" font-weight="700" fill="#0f172a">Deployment</text>
    <text x="890" y="658" font-size="11" fill="#64748b">Local stack validated · cloud manifests not yet rolled out</text>

    <g font-size="12" fill="#1e293b">
      <rect x="890" y="678" width="200" height="50" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="990" y="700" text-anchor="middle" font-weight="600" fill="#166534">Docker Compose</text>
      <text x="990" y="716" text-anchor="middle" font-size="10" fill="#166534">validated locally · 14 services</text>

      <rect x="1110" y="678" width="210" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="1215" y="700" text-anchor="middle" font-weight="600">K8s / EKS overlays</text>
      <text x="1215" y="716" text-anchor="middle" font-size="10" fill="#64748b">statically validated only</text>

      <rect x="890" y="740" width="430" height="42" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="1105" y="766" text-anchor="middle" font-weight="600" fill="#9a3412">AWS — not deployed</text>
    </g>
  </g>

  <!-- Observability dotted connectors to services -->
  <path d="M 340 330 C 340 560, 250 600, 250 676" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="2 4" marker-end="url(#arrow-gray)" opacity="0.85"/>
  <path d="M 650 330 C 650 560, 545 600, 545 676" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="2 4" marker-end="url(#arrow-gray)" opacity="0.85"/>
  <path d="M 520 550 C 520 600, 735 600, 735 676" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="2 4" marker-end="url(#arrow-gray)" opacity="0.85"/>

  <!-- Footer caption -->
  <text x="60" y="836" font-size="10" fill="#94a3b8">Models: BGE-small-en-v1.5 (text · 384-dim) · CLIP ViT-B/32 (image · 512-dim · opt-in) · bge-reranker-base.  Storage: Milvus standalone · Redis (cluster mode disabled by design).</text>
</svg>
