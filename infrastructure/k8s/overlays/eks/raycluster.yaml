---
# RayCluster: Advanced Ray autoscaling with KubeRay Operator
# Optional advanced configuration for Ray autoscaling
# Provides better Ray-native autoscaling than standard K8s HPA

apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: scalestyle-ray-cluster
  namespace: scalestyle
  labels:
    app: scalestyle
    component: ray-cluster
spec:
  # Ray version
  rayVersion: '2.9.0'
  
  # Enable autoscaling
  enableInTreeAutoscaling: true
  
  # Autoscaler options
  autoscalerOptions:
    # Upscaling speed
    upscalingSpeed: 1.0
    # Idle timeout in seconds
    idleTimeoutSeconds: 60
    # Image for autoscaler
    image: rayproject/ray:2.9.0
    # Resources for autoscaler sidecar
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
  
  # Head node configuration (1 replica, not autoscaled)
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
      block: 'true'
    
    template:
      metadata:
        labels:
          app: scalestyle
          component: ray-head
          ray.io/node-type: head
      spec:
        containers:
        - name: ray-head
          image: scalestyle-inference:__MUST_BE_OVERRIDDEN_BY_KUSTOMIZE__
          imagePullPolicy: IfNotPresent
          
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          - containerPort: 8000
            name: serve
          
          # Environment variables
          envFrom:
          - configMapRef:
              name: scalestyle-config
          
          # Resources
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          
          # Production cache strategy for autoscaled Ray pods:
          # model artifacts must be pre-baked into the inference image.
          # A per-pod emptyDir is not operationally safe for large model loads,
          # and a single RWO PVC cannot be shared across autoscaled workers.
  
  # Worker node configuration (autoscaled)
  workerGroupSpecs:
  - replicas: 1  # Initial replicas
    minReplicas: 1
    maxReplicas: 5
    groupName: worker-group
    
    rayStartParams:
      block: 'true'
    
    template:
      metadata:
        labels:
          app: scalestyle
          component: ray-worker
          ray.io/node-type: worker
      spec:
        containers:
        - name: ray-worker
          image: scalestyle-inference:__MUST_BE_OVERRIDDEN_BY_KUSTOMIZE__
          imagePullPolicy: IfNotPresent
          
          # Environment variables
          envFrom:
          - configMapRef:
              name: scalestyle-config
          
          # Resources
          # 8Gi limit required: BGE-small (~134MB) + bge-reranker-base (~90MB) +
          # CLIP ViT-B/32 (openai/clip-vit-base-patch32, ~0.6GB) + Ray object store (1GB) + overhead.
          resources:
            limits:
              cpu: "2"
              memory: "8Gi"
            requests:
              cpu: "500m"
              memory: "2Gi"

          # Production cache strategy for autoscaled Ray pods:
          # model artifacts must be pre-baked into the inference image.

---
# RayService: Exposes Ray Serve deployments
# This manages the Ray Serve application lifecycle
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: scalestyle-ray-service
  namespace: scalestyle
  labels:
    app: scalestyle
    component: ray-service
spec:
  serviceUnhealthySecondThreshold: 300
  deploymentUnhealthySecondThreshold: 300
  
  # Reference to RayCluster
  rayClusterConfig:
    rayVersion: '2.9.0'
    headGroupSpec:
      # Same as RayCluster headGroupSpec above
      rayStartParams:
        dashboard-host: '0.0.0.0'
      template:
        spec:
          containers:
          - name: ray-head
            image: scalestyle-inference:__MUST_BE_OVERRIDDEN_BY_KUSTOMIZE__
            resources:
              limits:
                cpu: "2"
                memory: "4Gi"
              requests:
                cpu: "500m"
                memory: "1Gi"
    
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 5
      groupName: worker-group
      rayStartParams: {}
      template:
        spec:
          containers:
          - name: ray-worker
            image: scalestyle-inference:__MUST_BE_OVERRIDDEN_BY_KUSTOMIZE__
            resources:
              limits:
                cpu: "2"
                memory: "4Gi"
              requests:
                cpu: "500m"
                memory: "1Gi"
  
  # Ray Serve configuration
  # Note: This RayService spec is for advanced autoscaling (optional)
  # For basic deployment, use standard Deployment (30-inference.yaml)
  # serveConfigV2 is EXPERIMENTAL / PLACEHOLDER — do not use for production deploys.
  # The standard inference Deployment (base/inference.yaml) is the validated path.
  # Known issues with this block:
  #   - import_path points to a non-existent module (src.ray_serve.deployments.ingress).
  #     Actual module is src.deployments.ingress; no top-level ingress_app factory exists.
  #   - PopularityDeployment and GenerationDeployment are not exported from ingress.py.
  #     Remove GENERATION_ENABLED from serveConfigV2 env_vars if GenerationDeployment
  #     is excluded.
  # To use KubeRay in production: verify import_path against the actual Ray Serve
  # app factory, then remove this comment block.
  serveConfigV2: |
    applications:
    - name: scalestyle
      route_prefix: /
      # PLACEHOLDER: update import_path to match the actual Ray Serve app factory
      # before deploying. Actual module: src.deployments.ingress (no ingress_app export).
      import_path: src.ray_serve.deployments.ingress:ingress_app
      runtime_env:
        working_dir: "."
        env_vars:
          PYTHONPATH: "/app"
          HF_HOME: "/cache/huggingface"
          TRANSFORMERS_CACHE: "/cache/huggingface/hub"
      deployments:
      - name: IngressDeployment
      - name: EmbeddingDeployment
      - name: RetrievalDeployment
      - name: PopularityDeployment
      - name: GenerationDeployment
      - name: RerankerDeployment
      - name: VisionDeployment
