---
# ConfigMap patch for EKS production
# Disables LLM generation and reduces Ray memory allocation to fit within the 8Gi
# container limit alongside all loaded models.
#
# Approximate memory profile with GENERATION_ENABLED=0, VISION_ENABLED=1:
#   - Ray managed heap (RAY_MEMORY_GB):         2.5 GB
#   - Ray object store (RAY_OBJECT_STORE_GB):   0.5 GB
#   - BAAI/bge-small-en-v1.5 (FP32):          ~0.13 GB
#   - BAAI/bge-reranker-base:                  ~0.28 GB  (approximate)
#   - CLIP ViT-B/32 (openai/clip-vit-base-patch32):  ~0.6  GB
#   - Runtime overhead:                              ~0.5  GB
#   Total:                                           ~4.5  GB  (fits in 8Gi limit)
#
# To re-enable generation (Qwen2-1.5B ~3 GB):
#   1. Change GENERATION_ENABLED to "1"
#   2. Set RAY_MEMORY_GB: "6.0" and RAY_OBJECT_STORE_GB: "1.0"
#   3. Increase memory limit in resource-limits-production.yaml to 12Gi
#   4. Ensure EKS node group uses t3.xlarge or larger (32 GB RAM)
apiVersion: v1
kind: ConfigMap
metadata:
  name: scalestyle-config
  namespace: scalestyle
data:
  GENERATION_ENABLED: "0"
  # Ray memory: production profile without generation
  RAY_MEMORY_GB: "2.5"
  RAY_OBJECT_STORE_GB: "0.5"
